  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: geraldpeng6/wonton-plugin-template/.github/workflows/plugin-check.yml@50cb7ca300c4c2fb6c20d53ee7c9b2897aaaa51d
